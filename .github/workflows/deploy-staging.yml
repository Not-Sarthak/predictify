name: Build and Deploy to EC2 (Staging)

on:
    push:
        branches:
            - dev
        paths:
            - "src/**"
            - ".github/workflows/deploy-staging.yml"
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Extract short commit SHA
              id: vars
              run: echo "SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

            - name: Build and Push Docker image with Cache
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      radioac7iv/tg-bot:staging
                      radioac7iv/tg-bot:${{ steps.vars.outputs.SHA_SHORT }}
                  cache-from: type=registry,ref=radioac7iv/tg-bot:buildcache
                  cache-to: type=registry,ref=radioac7iv/tg-bot:buildcache,mode=max

            - name: Deploy via SSH to EC2 (Staging)
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.EC2_HOST_STAGING }}
                  username: ubuntu
                  key: ${{ secrets.EC2_SSH_KEY_STAGING }}
                  script: |
                      IMAGE=radioac7iv/tg-bot:staging
                      CONTAINER=tg-bot

                      echo "Logging into Docker..."
                      echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

                      echo "Pulling staging image..."
                      docker pull $IMAGE

                      echo "Stopping old staging container (if exists)..."
                      docker stop $CONTAINER || true
                      docker rm $CONTAINER || true

                      echo "Running new staging container..."
                      docker run -d \
                        --name $CONTAINER \
                        --env-file /home/ubuntu/tg-bot/.env.staging \
                        --restart unless-stopped \
                        -p 3000:3000 \
                        -p 4000:4000 \
                        $IMAGE

                      echo "Pruning old images..."
                      docker image prune -f
