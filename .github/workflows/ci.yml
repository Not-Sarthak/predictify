name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format
              run: bun run format:check

            - name: Test
              run: bun test
